[window]
opacity = 0.8
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 100
lines = 30

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
normal = { family = "MesloLGS Nerd Font", style = "Regular" }
bold = { family = "MesloLGS Nerd Font", style = "Bold" }
italic = { family = "MesloLGS Nerd Font", style = "Italic" }
bold_italic = { family = "MesloLGS Nerd Font", style = "Bold Italic" }

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x1a1a1a"
foreground = "0xd0d0d0"

[colors.normal]
black   = "0x666666"
red     = "0xBF616A"
green   = "0x8fad7a"
yellow  = "0xc9a96e"
blue    = "0x6a8fa8"
magenta = "0x9d7a9d"
cyan    = "0x6a9fad"
white   = "0xc8c8c8"

[colors.bright]
black   = "0x444444"
red     = "0xBF616A"
green   = "0x8fad7a"
yellow  = "0xc9a96e"
blue    = "0x6a8fa8"
magenta = "0x9d7a9d"
cyan    = "0x7aafad"
white   = "0xe0e0e0"

[terminal]

[terminal.shell]
program = "/bin/zsh"
